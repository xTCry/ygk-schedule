<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Просмотр опубликованного расписания Ярославского градостроительного колледжа"
    />
    <title>Расписание группы · ЯГК</title>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./">ЯГК · расписание</a>
        <div class="flex items-center gap-3">
          <a class="text-link text-sm" href="./">О сайте</a>
          <button id="theme-toggle" class="theme-toggle" type="button"></button>
        </div>
      </header>

      <main class="space-y-5">
        <section class="paper-panel group-picker-panel">
          <div
            class="flex flex-col justify-between gap-5 lg:flex-row lg:items-end"
          >
            <div>
              <p class="eyebrow">Ближайшие учебные дни</p>
              <h1
                id="group-title"
                class="mt-2 text-3xl font-semibold tracking-tight sm:text-4xl"
              ></h1>
              <p
                id="group-updates"
                class="mt-3 text-sm text-stone-500 dark:text-stone-400"
              >
                Загружаем дату обновления…
              </p>
            </div>
            <button id="calendar-button" class="button-primary" type="button">
              Добавить расписание в календарь
            </button>
          </div>
        </section>

        <section class="paper-panel">
          <div class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]">
            <label>
              <span class="form-label">Группа</span>
              <div class="group-picker">
                <div class="group-picker-field">
                  <input
                    id="group-input"
                    class="form-select group-picker-input"
                    placeholder="Например, СТ1-11"
                    disabled
                  />
                  <button
                    id="group-clear"
                    class="group-picker-clear"
                    type="button"
                    aria-label="Очистить поиск группы"
                    title="Очистить поиск"
                    disabled
                  >
                    ×
                  </button>
                  <button
                    id="group-toggle"
                    class="group-picker-toggle"
                    aria-label="Показать список групп"
                    disabled
                  ></button>
                </div>
                <ul
                  id="group-options"
                  class="group-picker-options"
                  role="listbox"
                  aria-label="Список групп"
                  hidden
                ></ul>
              </div>
            </label>
            <label>
              <span class="form-label">Подгруппа</span>
              <select id="subgroup-select" class="form-select" disabled>
                <option>Все подгруппы</option>
              </select>
            </label>
          </div>
          <p
            id="group-status"
            class="mt-4 text-sm text-stone-500 dark:text-stone-400"
            aria-live="polite"
          >
            Загружаем опубликованные данные…
          </p>
        </section>

        <section class="paper-panel">
          <p class="eyebrow">Официальный файл расписания</p>
          <div
            id="source-links"
            class="mt-3 flex flex-wrap gap-2 text-sm"
          ></div>
        </section>

        <section id="group-diagnostics" class="space-y-3"></section>
        <section id="schedule" class="grid gap-4 xl:grid-cols-2"></section>
      </main>

      <footer class="site-footer">
        Автоматическая обработка может не распознать нестандартную строку. Для
        важных изменений сверяйтесь с официальными источниками.
      </footer>
    </div>

    <dialog id="calendar-dialog" class="modal-dialog">
      <form method="dialog" class="flex justify-end">
        <button
          id="calendar-dialog-close"
          class="button-quiet"
          aria-label="Закрыть окно"
        >
          Закрыть
        </button>
      </form>
      <div id="calendar-dialog-content"></div>
    </dialog>

    <dialog id="replacement-dialog" class="modal-dialog">
      <form method="dialog" class="flex justify-end">
        <button
          id="replacement-dialog-close"
          class="button-quiet"
          aria-label="Закрыть окно"
        >
          Закрыть
        </button>
      </form>
      <div id="replacement-dialog-content"></div>
    </dialog>

    <script type="module" src="/src/group.ts"></script>
  </body>
</html>
