name: update schedule

on:
  schedule:
    # GitHub интерпретирует cron в UTC. Запуск раз в два часа, в 17 минут.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: schedule-data-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout published data
        uses: actions/checkout@v6
        with:
          ref: data
          fetch-depth: 0

      - name: checkout parser
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: parser
          persist-credentials: false

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: parser/package-lock.json

      - name: install dependencies
        working-directory: parser
        run: make install

      - name: check parser
        id: check-parser
        working-directory: parser
        run: npm run workflow:check

      - name: update schedule data
        id: update-data
        working-directory: parser
        run: npm run workflow:update-schedule -- --output-dir "$GITHUB_WORKSPACE" --page-url "https://ygk.edu.yar.ru/raspisanie.html"

      - name: commit published data
        id: publish-data
        working-directory: parser
        run: npm run workflow:publish -- --output-dir "$GITHUB_WORKSPACE" --kind schedule

      - name: synchronize diagnostic issues
        id: sync-issues
        working-directory: parser
        run: npm run sync-issues -- --output-dir "$GITHUB_WORKSPACE" --repo "$GITHUB_REPOSITORY" --max-writes 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: write workflow status
        if: always()
        working-directory: parser
        run: npm run workflow:summary -- --event "${{ github.event_name }}" --parser-revision "${{ github.sha }}" --check "${{ steps.check-parser.outcome }}" --update "${{ steps.update-data.outcome }}" --ical "${{ steps.update-data.outcome }}" --publish "${{ steps.publish-data.outputs.status || steps.publish-data.outcome }}" --issues "${{ steps.sync-issues.outputs.status || steps.sync-issues.outcome }}"
