name: update schedule

on:
  schedule:
    # GitHub интерпретирует cron в UTC. Запуск раз в два часа, в 17 минут.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: schedule-data-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout published data
        uses: actions/checkout@v6
        with:
          ref: data
          fetch-depth: 0

      - name: checkout parser
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: parser
          persist-credentials: false

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: parser/package-lock.json

      - name: install dependencies
        working-directory: parser
        run: make install

      - name: check parser
        id: check-parser
        working-directory: parser
        run: |
          make check
          {
            echo "## Проверка parser"
            echo
            echo "✅ TypeScript, ESLint, Vitest и Prettier прошли успешно."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: update schedule data
        id: update-data
        working-directory: parser
        run: |
          make update OUTPUT_DIR="$GITHUB_WORKSPACE"
          base_changed=false
          if ! git diff --quiet -- base; then base_changed=true; fi
          BASE_CHANGED="$base_changed" node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';

          const root = process.env.GITHUB_WORKSPACE;
          const schedule = JSON.parse(
            await readFile(`${root}/base/00-schedule.json`, 'utf8'),
          );
          const diagnostics = JSON.parse(
            await readFile(`${root}/base/90-diagnostics.json`, 'utf8'),
          );
          const summary = diagnostics.summary;
          const changed = process.env.BASE_CHANGED === 'true' ? 'да' : 'нет';

          console.log('## Базовое расписание');
          console.log('');
          console.log(`- Изменения перед публикацией: **${changed}**`);
          console.log(`- Групп: **${Object.keys(schedule.groups).length}**`);
          console.log(`- Источников XLSX: **${schedule.sources.length}**`);
          console.log(`- Версия данных: \`${schedule.version.value}\``);
          console.log(
            `- Diagnostics: ${summary.info} info, ${summary.warning} warnings, ${summary.error} errors, ${summary.fatal} fatal.`,
          );
          NODE

      - name: generate calendars
        id: generate-ical
        working-directory: parser
        run: |
          make generate-ical OUTPUT_DIR="$GITHUB_WORKSPACE"

      - name: commit published data
        id: publish-data
        run: |
          git add base ical

          if git diff --cached --quiet; then
            echo "Schedule data is unchanged"
            {
              echo "### Публикация"
              echo
              echo "Изменений в \`base/\` и \`ical/\` нет — commit не создан."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          files=$(git diff --cached --name-only -- base ical | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update schedule"
          git push origin HEAD:data
          commit=$(git rev-parse --short HEAD)
          {
            echo "### Публикация"
            echo
            echo "- Обновлено файлов в \`base/\` и \`ical/\`: **$files**"
            echo "- Commit: \`$commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: synchronize diagnostic issues
        id: sync-issues
        working-directory: parser
        run: |
          make sync-issues \
            DIAGNOSTICS_PATH="$GITHUB_WORKSPACE/base/90-diagnostics.json" \
            SYNC_ISSUES_REPORT="$RUNNER_TEMP/sync-issues.json"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { appendFile, readFile } from 'node:fs/promises';

          const report = JSON.parse(
            await readFile(
              `${process.env.GITHUB_WORKSPACE}/base/90-diagnostics.json`,
              'utf8',
            ),
          );
          const sync = JSON.parse(
            await readFile(`${process.env.RUNNER_TEMP}/sync-issues.json`, 'utf8'),
          );
          console.log('### Диагностические Issue');
          console.log('');
          if (sync.deferred) {
            console.log(
              `Синхронизация отложена: **${sync.deferred.reason}**. Следующий запуск продолжит работу без ожидания в этом workflow.`,
            );
          } else {
            console.log(
              `Синхронизация завершена. Черновиков Issue в текущей выгрузке: **${report.issues.length}**.`,
            );
          }
          await appendFile(
            process.env.GITHUB_OUTPUT,
            `status=${sync.deferred ? 'deferred' : 'success'}\n`,
          );
          NODE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: write workflow status
        if: always()
        run: |
          {
            echo "## Итог workflow"
            echo
            echo "- Событие: \`${{ github.event_name }}\`"
            echo "- Ревизия parser: \`${{ github.sha }}\`"
            echo "- Проверка parser: \`${{ steps.check-parser.outcome }}\`"
            echo "- Выгрузка данных: \`${{ steps.update-data.outcome }}\`"
            echo "- Генерация ICS: \`${{ steps.generate-ical.outcome }}\`"
            echo "- Публикация: \`${{ steps.publish-data.outcome }}\`"
            echo "- Синхронизация Issue: \`${{ steps.sync-issues.outputs.status || steps.sync-issues.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
