# Даты праздников, каникул, переносов и предпраздничных дней будут добавлены
# отдельным этапом. До этого preholiday-время хранится как справочные данные.
schema_version: 1
timezone: Europe/Moscow
term:
  # Активный семестр выбирается автоматически по текущей дате:
  # с начала first — первый, до него — второй.
  first:
    start: '09-01'
    end: '12-31'
  second:
    start: '01-12'
    end: '06-30'
  # Временная точка чередования недель. Когда parser замен сможет надежно
  # извлекать дату и числитель/знаменатель, она будет уточняться автоматически.
  fallback_week_anchor:
    date: '2026-09-07'
    week_type: numerator
  # Исключения для групп при особых сроках семестра. Значения также MM-DD,
  # а first/second применяются автоматически вместе с базовым семестром.
  # Пример:
  # group_ranges:
  #   СТ1-11:
  #     first:
  #       start: '09-01'
  #       end: '12-20'
  #     second:
  #       start: '01-12'
  #       end: '05-20'
  group_ranges: {}

bells_file: bells.yaml
regulations_file: regulations.yaml

# Публичные ICS публикуются GitHub Pages из snapshot ветки data.
publication:
  source_url_template: https://xtcry.github.io/ygk-schedule/ical/{kind}/{group}.ics
  refresh_interval: PT2H

# Профиль определяется прежде всего по аудитории конкретного занятия.
# Номерная аудитория «А203» / «А 203» означает корпус А. Код группы нужен
# только как второе условие для Т и Ф, где у разных курсов разные звонки.
room_profiles:
  buildings:
    А:
      profile: a-m
    М:
      profile: a-m
    Б:
      profile: b-v
    В:
      profile: b-v
    Т:
      course_profiles:
        '1': t-year-1
        '2': t-years-2-4
        '3': t-years-2-4
        '4': t-years-2-4
    Ф:
      course_profiles:
        '2': f-years-2-4
        '3': f-years-2-4
        '4': f-years-2-4
      # Эти группы явно перечислены в таблице звонков для первого курса.
      group_overrides:
        ЮР1-11: f-year-1
        ЮР1-12: f-year-1
        ЮР1-13: f-year-1
        ЮР1-14: f-year-1
        ЮР1-15: f-year-1
        ЮР1-16: f-year-1
        ЮР2-11: f-year-1
        ТУ1-11: f-year-1
        ТУ1-12: f-year-1
        ЭК1-11: f-year-1
        ЭК1-12: f-year-1
  # Такие обозначения не считаются корпусом по первой букве. Время появляется
  # только при явно заданном profile; иначе событие безопасно пропускается.
  special_rooms:
    ДОТ: remote
    РОТ: unknown
    Спорт корпус: sport
    # Для спортзала используется общий профиль: во вторую пару время может
    # отличаться между корпусами, но для подтвержденных пар текущей выгрузки
    # это правило соответствует опубликованной таблице звонков.
    Спортзал:
      kind: sport
      profile: a-m
      aliases:
        - Сп.зал
        - Сп. зал
        - Спорт.зал
        - Спорт. зал
        - Спорт зал
        - Спортивный зал
